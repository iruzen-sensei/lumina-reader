name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Caches the Gradle distribution + dependency artifacts downloaded by
      # `flutter build apk` (AGP 8.11, KGP 2.2, plugin AARs). First run stays
      # cold; subsequent runs skip ~1GB of downloads.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned: all four quality gates and the Android build are verified
          # against this exact toolchain. Floating `channel: stable` lets
          # upstream Gradle-plugin changes (e.g. the AGP 9 `newDsl` migration)
          # break plugin modules at random. Bump deliberately, with a green
          # local run first.
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Quality gate #1: static audit (schema registration, import order,
      # duplicate symbols, phantom APIs, mock-data regressions).
      # FAILS the build — never continue-on-error.
      - name: Static audit gate
        run: python3 tool/audit.py

      # Quality gate #2: codegen. Isar schemas / Riverpod / JSON serializers
      # MUST generate or the build is broken. Previously hidden behind
      # continue-on-error: true — that masked total codegen failure.
      - name: Generate code (Isar, Riverpod, JSON)
        run: dart run build_runner build --delete-conflicting-outputs

      # Quality gate #3: analyzer. Zero errors allowed.
      - name: Analyze
        run: flutter analyze --no-pub

      # Quality gate #4: compile smoke test. Runs the whole app library
      # graph through the real Dart kernel compiler — catches package-level
      # compile breaks (e.g. upstream null-safety bugs under newer SDKs)
      # that `flutter analyze` cannot see. The fixture tests validate the
      # native extension parsers (Madara HTML + MangaDex JSON) against
      # captured real-site payloads, network-independent.
      - name: Fetch Linux Isar core binary (repository tests)
        # isar_flutter_libs ships no Linux binary; the repository delete/
        # link regression tests need it to open a real database.
        run: |
          curl -sL -o libisar.so https://github.com/isar/isar/releases/download/3.1.0%2B1/libisar_linux_x64.so
          ls -la libisar.so

      # Quality gate #4: compile smoke test + extension-parser fixtures +
      # repository regression tests (delete flows, chapter linking — the
      # Isar async-put link orphaning bug). All network-independent.
      - name: Test suite
        run: flutter test test/compile_smoke_test.dart test/madara_fixture_test.dart test/mangadex_fixture_test.dart test/repository_delete_test.dart test/extension_regressions_test.dart test/native_templates_fixture_test.dart

      # The keystore MUST exist BEFORE `flutter build apk`: Gradle signs the
      # release build itself (android/app/build.gradle.kts wires the release
      # signingConfig), so a build-first-sign-later order can never produce a
      # signed APK — and the separate zipalign+apksigner pass is unnecessary
      # (re-signing after alignment can even invalidate the signature Gradle
      # already applied).
      #
      # Stable signing (recommended): set these repository secrets —
      #   LUMINA_KEYSTORE_BASE64    base64 of your .jks  (base64 -w0 key.jks)
      #   LUMINA_KEYSTORE_PASSWORD  keystore password
      #   LUMINA_KEY_ALIAS          key alias
      #   LUMINA_KEY_PASSWORD       key password
      # Without secrets an ephemeral key is generated per run; APKs from
      # different runs then carry different signatures and will NOT install
      # as updates over each other.
      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LUMINA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LUMINA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LUMINA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LUMINA_KEY_PASSWORD }}
        run: |
          mkdir -p .github
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using keystore from LUMINA_KEYSTORE_BASE64 secret"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > .github/signing-keystore.jks
          elif [ ! -f .github/signing-keystore.jks ]; then
            echo "No keystore secret — generating ephemeral key"
            keytool -genkeypair \
              -alias "${KEY_ALIAS:-lumina}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 36500 \
              -keystore .github/signing-keystore.jks \
              -storepass "${KEYSTORE_PASSWORD:-lumina2026}" \
              -keypass "${KEY_PASSWORD:-lumina2026}" \
              -dname "CN=Lumina,O=Lumina"
          fi

      # Signed by Gradle during the build (release signingConfig). There is
      # deliberately NO manual zipalign/apksigner step afterwards.
      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.LUMINA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LUMINA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LUMINA_KEY_PASSWORD }}
        # cronetHttpNoPlay=true bundles the embedded Cronet (Chrome TLS
        # stack) instead of relying on the Google-Play-Services provider —
        # sideloaded APKs must reach CF-fronted sources (AniZone, Madara
        # mirrors) on devices without GMS too.
        run: flutter build apk --release --dart-define=cronetHttpNoPlay=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lumina-reader-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
