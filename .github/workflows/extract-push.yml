name: Extract source from zip and push

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find zip, extract source, commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ZIP=$(find . -name '*.zip' -not -path './.git/*' | head -1)
          if [ -z "$ZIP" ]; then echo "No zip found"; exit 1; fi
          echo "Extracting: $ZIP"
          unzip -q "$ZIP"
          rsync -a --exclude='.git' --exclude='.github' lumina-reader/ ./
          rm -rf lumina-reader
          git add -A
          git reset -q -- .github
          if git status --porcelain | grep -q '^[AM]'; then
            git commit -m "Extract Lumina Reader source from zip"
            git push origin HEAD:main
          else
            echo "Nothing to commit"
          fi
