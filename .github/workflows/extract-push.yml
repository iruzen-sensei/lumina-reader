name: Extract source from zip and push

on:
  workflow_dispatch:

permissions:
  contents: write
  workflows: write

jobs:
  extract-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find zip, extract, commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ZIP=$(find . -name '*.zip' -not -path './.git/*' | head -1)
          if [ -z "$ZIP" ]; then echo "No zip found"; exit 1; fi
          echo "Extracting: $ZIP"
          unzip -q "$ZIP"
          rsync -a --exclude='.git' lumina-reader/ ./
          # Pin CI to the exact Flutter version this code was verified against
          sed -i 's/channel: stable/flutter-version: "3.47.4"/' .github/workflows/build-android.yml
          rm -rf lumina-reader "$ZIP"
          git add -A
          git commit -m "Extract Lumina Reader source from zip" || { echo "Nothing to commit"; exit 0; }
          git push
