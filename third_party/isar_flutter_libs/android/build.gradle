group 'dev.isar.isar_flutter_libs'
version '1.0'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // AGP 8 requires the namespace in the build file; isar 3.1.0+1 is
    // abandoned upstream so this fork carries the fix (taken from the
    // manifest package attribute).
    namespace 'dev.isar.isar_flutter_libs'
    compileSdk 35

    defaultConfig {
        minSdk 21
    }
}

dependencies {
    implementation "androidx.startup:startup-runtime:1.1.1"
}
