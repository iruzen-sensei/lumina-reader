org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 reads only the new DSL and enables built-in Kotlin by default. The
# Flutter Gradle plugin (and legacy plugin modules) still target the old
# interfaces, so both behaviors are explicitly opted out — identical to the
# Flutter 3.47.4 `flutter create` template defaults.
android.newDsl=false
android.builtInKotlin=false
kotlin.code.style=official
