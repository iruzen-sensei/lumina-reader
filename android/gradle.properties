org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Opt out of AGP 9's new-DSL-only mode and built-in Kotlin (no-ops on the
# AGP 8.11 line we build on; required if the project ever moves to AGP 9).
# Matches the Flutter 3.47.4 `flutter create` template defaults.
android.newDsl=false
android.builtInKotlin=false
kotlin.code.style=official
