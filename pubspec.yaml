name: lumina_reader
description: Premium E-Book, Manga, Novel & Anime Reader with Extension System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.0

  # Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5

  # HTTP & Networking
  http: ^1.2.2
  http_interceptor: ^3.0.0
  connectivity_plus: ^7.3.1
  # Chrome's TLS/HTTP stack on Android (HTTP/2+3, Brotli). CRITICAL for
  # Cloudflare-fronted sources: CF fingerprints dart:io HttpClient's TLS
  # ClientHello (JA3) and serves challenge pages to it from ANY IP — curl
  # and Cronet sail through the same edge. AniZone (and several Madara
  # mirrors) are unreachable through dart:io on real devices without this.
  # CI builds with --dart-define=cronetHttpNoPlay=true so the embedded
  # Cronet is bundled (no Google-Play-Services dependency).
  cronet_http: ^1.9.0

  # Reader - Manga
  extended_image: ^8.2.4
  scrollable_positioned_list: ^0.3.8

  # Reader - Novels
  flutter_html: ^3.0.0
  flutter_tts: ^4.2.5

  # Reader - EPUB (NEW)
  epubx: ^4.0.0
  archive: ^3.6.1

  # Reader - PDF (NEW)
  pdfrx: ^2.4.7

  # Anime Player (from Mangayomi — media_kit / libmpv)
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

  # UI & Theming
  cupertino_icons: ^1.0.8

  # Calendar (NEW — anime airing schedule)
  table_calendar: ^3.1.3

  # Utils
  intl: ^0.20.0
  # EXACT PIN — 13.x requires win32 ^6.0.1, incompatible with file_picker
  # 11.0.3 (win32 ^5.9.0, the last Android-embedded release). 12.0.2 is the
  # newest win32-5-compatible line; SharePlus.instance.share(ShareParams)
  # is unchanged.
  share_plus: 12.0.2
  url_launcher: ^6.3.1
  # EXACT PIN — do NOT relax to ^: file_picker 12.0.0+ federates its Android
  # implementation to `android_file_picker`, whose Gradle script (identical
  # in 1.1.1 and 2.0.0 — AGP-9-aware `newDsl` detection reading the flutter
  # extension at build.gradle.kts:59) fails `flutter build apk` on our AGP
  # 8.7 toolchain. 11.0.3 is the last release with the Android implementation
  # embedded — no android_file_picker module in the build at all. The static
  # pickFiles API (13.x style) is already available here; only cancel
  # semantics differ. Requires the win32 ^5.x world (see share_plus,
  # wakelock_plus pins below and removed device_info_plus/package_info_plus).
  file_picker: 11.0.3
  permission_handler: ^13.0.2
  # device_info_plus and package_info_plus REMOVED — both were declared but
  # never imported (phantoms from the original skeleton), and both required
  # win32 ^6.0.x, which conflicted with file_picker 11.0.3 (win32 ^5.9.0).
  # Note: url_launcher, app_links, local_auth and permission_handler are also
  # currently unimported — candidates for a follow-up hygiene pass.
  # EXACT PIN — 1.6.0+ requires win32 >=6.0.0, incompatible with
  # file_picker 11.0.3 (win32 ^5.9.0). 1.5.2 is the last win32-5 release;
  # WakelockPlus.enable()/disable() is unchanged.
  wakelock_plus: 1.5.2
  crypto: ^3.0.6
  encrypt: ^5.0.3
  html: ^0.15.5
  path: ^1.9.0

  # Extension interpreters (runtime for source extensions)
  # NOTE: d4rt (Dart interpreter) REMOVED — every published version conflicts
  # with isar_generator's analyzer/source_gen constraints, and the backend was
  # parked as experimental anyway. The supported extension path is native
  # Dart sources (eval/native/) + QuickJS (flutter_qjs).

  # Localization & Deep links
  app_links: ^6.4.0

  # Local auth (app lock)
  local_auth: ^2.3.0

  # Hive (lightweight KV)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # OAuth for trackers

  # External player intents (VLC, MX Player, etc.)

  # JSON annotations (for models with @JsonSerializable)
  json_annotation: ^4.9.0

  # Meta (for @immutable, @protected, etc.)
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1
  flutter_launcher_icons: ^0.13.1
  json_serializable: ^6.8.0

# Force image ^4.0.0 to resolve epubx (needs ^3.x) vs media_kit (needs ^4.x) conflict
dependency_overrides:
  image: ^4.0.17
  # flutter_html 3.0.0 calls html's top-level `matches(Element, String)`,
  # which html 0.15.7 removed (moved into SelectorEvaluator). 0.15.6 keeps it.
  html: 0.15.6
  # Local fork of epubx 4.0.0 patched for image 4.x (see above).
  epubx:
    path: third_party/epubx
  # Local fork of isar_flutter_libs 3.1.0+1: upstream is abandoned and its
  # Android module has no `namespace`, which AGP 8 (Flutter 3.47.4's minimum
  # supported line) hard-fails on. Only the android/ build files differ.
  isar_flutter_libs:
    path: third_party/isar_flutter_libs
  # Local fork of pdfrx_engine 0.4.5 with a two-character null-safety patch
  # (pdf_file_cache.dart): upstream uses `cache.blockSize` / `cache.read(...)`
  # on a `PdfFileCache?` without `!`, which fails to COMPILE under the Dart
  # 3.13 flow analysis (analyze passes, kernel compile fails). Upgrading to
  # pdfrx >= 2.4.8 instead would force archive ^4.0.9, which conflicts with
  # epubx. Remove this override once pdfrx supports archive 3/4 dual.
  pdfrx_engine:
    path: third_party/pdfrx_engine

flutter:
  uses-material-design: true

  # Type system (Lumina Noir — x.ai/ElevenLabs/OpenAI black-theme dialect):
  #   Inter 400/500/600 — the single body/UI/display family (Sohne /
  #   Waldenburg / Universal Sans class; grotesk, weight-400 display with
  #   negative tracking — never bold display).
  #   JetBrains Mono 400/500 — uppercase tracked eyebrow labels, stat
  #   values and technical captions (the x.ai/Warp engineered dialect).
  #   Static TTFs so the identity survives offline (no google_fonts fetch).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
